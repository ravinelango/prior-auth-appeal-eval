[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prior-auth-appeal-eval"
version = "0.1.0"
description = "Deterministic checks for LLM-drafted prior-authorization appeal letters: citation grounding, chart-traceable facts, denial-reason coverage, identifiers, required elements."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ravin Elango" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
openai = ["openai>=1.0"]

[project.scripts]
pae = "prior_auth_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/prior_auth_eval"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
