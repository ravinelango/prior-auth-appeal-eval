name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Smoke test CLI with the offline mock drafter
        run: pae validate --cases examples/synthetic_cases.json && pae run --cases examples/synthetic_cases.json --drafter mock:good --strict --out reports/good.md && pae run --cases examples/synthetic_cases.json --drafter mock:flawed --out reports/flawed.md
      # Not --strict: PA-034's good letter carries a documented false positive
      # (known_false_positives), so the decision is NO-GO by design. pytest checks that
      # good letters fail only on those documented findings.
      - name: Smoke test CLI on the hand-written cases
        run: pae validate --cases examples/handwritten_cases.json && pae run --cases examples/handwritten_cases.json --drafter mock:good --out reports/handwritten_good.md && pae run --cases examples/handwritten_cases.json --drafter mock:flawed --out reports/handwritten_flawed.md
